server {
    listen 80;

    # Serve web static files
    root /wally/web;
    index index.html;

    # Proxy /api/ requests to FastAPI (keeps /api prefix)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The AI assistant can take a few minutes to answer on a slow computer
    location /api/assistant {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Handle root `/`
    location = / {
        try_files /index.html =404;
    }

    # Static files + allow extensionless .html pages
    location / {
        try_files $uri $uri.html =404;
    }
}
